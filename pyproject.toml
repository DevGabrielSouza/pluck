[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pluck"
version = "0.1.0"
description = "Interface desktop pro yt-dlp, feita com PySide6 e QML"
requires-python = ">=3.12"
license = "Unlicense"
license-files = ["LICENSE", "pluck/icons/LICENSE-lucide"]
dependencies = ["PySide6>=6.10"]

[project.scripts]
pluck = "pluck.app:main"

[tool.setuptools.packages.find]
include = ["pluck*"]

[tool.setuptools.package-data]
pluck = ["qml/*.qml", "qml/Pluck/*", "icons/*.svg", "assets/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N802", "N815", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the real yt-dlp executable"]

[tool.pyright]
include = ["pluck", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "pip-audit>=2.7"]
